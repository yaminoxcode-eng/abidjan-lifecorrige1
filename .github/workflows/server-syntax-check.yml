name: Server syntax and unit tests

on:
  push:
    branches:
      - staging/multiplayer-free-tier
  pull_request:
    branches:
      - main

jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check server JavaScript syntax
        run: node --check server/server.js
      - name: Run spatial zone unit tests
        run: node --test server/*.test.js
