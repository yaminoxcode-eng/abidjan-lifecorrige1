<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Abidjan Life — Administration</title><style>body{margin:0;background:#0b1722;color:#edf4f7;font:15px system-ui}main{max-width:850px;margin:36px auto;padding:22px}section{background:#152838;border:1px solid #456174;border-radius:14px;padding:18px;margin:14px 0}input,textarea,button{box-sizing:border-box;width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #547083;background:#0c1d2a;color:white}button{background:#c99b43;color:#111;font-weight:800;cursor:pointer}.danger{background:#9d4949;color:white}.muted{color:#a9bdc9;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main><h1>🏙️ Abidjan Life — Administration</h1><p class="muted">Console protégée. Le mot de passe administrateur n’est jamais enregistré dans le navigateur.</p><section><h2>Connexion administrateur</h2><input id="server" placeholder="URL du serveur Render (https://…)"><input id="password" type="password" placeholder="Mot de passe administrateur"><button onclick="connect()">Ouvrir la console</button><div id="status" class="muted"></div></section><section><h2>État du monde</h2><div id="stats">Connecte-toi pour afficher les statistiques.</div><button onclick="refresh()">Actualiser les statistiques</button></section><section><h2>Publier une version</h2><div class="grid"><input id="version" placeholder="Version, ex. 1.2.0"><input id="url" placeholder="URL Vercel immuable de cette version"></div><textarea id="notes" rows="4" placeholder="Journal des nouveautés visible par les joueurs"></textarea><label><input id="force" type="checkbox" style="width:auto"> Mise à jour urgente (rechargement forcé)</label><button onclick="publish()">Publier cette version</button></section><section><h2>Retour arrière</h2><input id="rollbackVersion" placeholder="Numéro d’une version précédente"><button class="danger" onclick="rollback()">Désactiver la version actuelle et restaurer</button><button class="danger" onclick="disableRelease()">Désactiver les mises à jour</button></section></main><script>let base='',token='';const $=id=>document.getElementById(id);async function api(path,body){const r=await fetch(base+path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'Erreur serveur');return d}function msg(s){$('status').textContent=s}async function connect(){base=$('server').value.trim().replace(/\/$/,'');token=$('password').value;try{await refresh();msg('Connecté.');}catch(e){msg(e.message)}}async function refresh(){try{const d=await api('/api/admin/stats');$('stats').innerHTML='<b>Version active :</b> '+d.currentVersion+'<br><b>Joueurs connectés :</b> '+d.players+'<br><b>Joueurs par version :</b><pre>'+JSON.stringify(d.byVersion,null,2)+'</pre>';msg('Statistiques actualisées.')}catch(e){msg(e.message);throw e}}async function publish(){try{const d=await api('/api/admin/publish',{version:$('version').value.trim(),clientUrl:$('url').value.trim(),notes:$('notes').value,force:$('force').checked});msg('Version '+d.manifest.version+' publiée.');await refresh()}catch(e){msg(e.message)}}async function rollback(){try{const d=await api('/api/admin/rollback',{version:$('rollbackVersion').value.trim()});msg('Retour arrière effectué vers '+d.manifest.version);await refresh()}catch(e){msg(e.message)}}async function disableRelease(){try{await api('/api/admin/disable',{});msg('Publication désactivée.')}catch(e){msg(e.message)}}</script></body></html>
